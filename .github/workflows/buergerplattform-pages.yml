name: Bürgerplattform veröffentlichen

# Bewusst nur manuell: Veröffentlichen ist ein Schritt, den jemand auslöst
# (Actions → "Bürgerplattform veröffentlichen" → Run workflow).
# Ziel: Ordner /buergerplattform/ auf dem Branch gh-pages. Der übrige Inhalt
# von gh-pages (bestehende React-Seite) bleibt unberührt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buergerplattform-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tailwind-CSS neu bauen und mit eingechecktem Stand vergleichen
        working-directory: src/buergerplattform
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- assets/tailwind.css || {
            echo "::error::assets/tailwind.css ist veraltet. Lokal 'npm run build:css' ausführen und committen."
            exit 1
          }

      - name: JSON-Daten prüfen
        working-directory: src/buergerplattform
        run: |
          for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error::Ungültiges JSON: $f"; exit 1; }; done

      - name: gh-pages holen
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Nur auslieferbare Dateien nach /buergerplattform/ kopieren
        run: |
          rm -rf pages/buergerplattform
          mkdir -p pages/buergerplattform/assets
          cd src/buergerplattform
          cp index.html impressum.html datenschutz.html ../../pages/buergerplattform/
          cp assets/app.js assets/legal.js assets/tailwind.css ../../pages/buergerplattform/assets/
          cp -r data texte ../../pages/buergerplattform/

      - name: Committen und pushen
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A buergerplattform
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Bürgerplattform veröffentlichen (${GITHUB_SHA::7})"
            git push origin gh-pages
          fi
